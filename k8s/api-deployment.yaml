apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage-api
  namespace: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage-api
    spec:
      containers:
        - name: homepage-api
          image: ghcr.io/paul-wtf/homepage-api:v0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LASTFM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: homepage-api-credentials
                  key: LASTFM_API_KEY
                  optional: true
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
