name: Previews
on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: previews
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BRANCH: chore/refresh-previews
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: paul-wtf/tidalwave
          path: tidalwave
          persist-credentials: false

      # Node 24 still ships corepack, which picks the pnpm version each of the
      # two repos names in its package.json.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 24

      - run: corepack enable

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm install --frozen-lockfile
        working-directory: tidalwave/frontend

      - name: Capture
        run: |
          (cd tidalwave/frontend && exec pnpm dev --port 4319 --strictPort) &
          timeout 60 bash -c 'until curl -sf http://localhost:4319 > /dev/null; do sleep 1; done'
          pnpm capture-previews
          TW_URL=http://localhost:4319 pnpm capture-tidalwave-demo

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/assets; then
            echo "Previews unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$BRANCH"
          git commit -m 'chore(previews): refresh project previews' -- src/assets
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base master --head "$BRANCH" \
              --title 'chore(previews): refresh project previews' \
              --body 'The weekly capture produced a preview that differs from the committed one. Look at both images before merging.'
          fi
